[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "modelforge"
version = "0.1.0"
description = "LLM fine-tuning toolkit with QLoRA, experiment tracking, and model serving"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "numpy>=1.26.0",
    "datasets>=2.19.0",
    "huggingface-hub>=0.23.0",
    "aiofiles>=23.0.0",
]

[project.scripts]
modelforge = "modelforge.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/modelforge"]
omit = ["*/ui/*"]

[tool.coverage.report]
show_missing = true
